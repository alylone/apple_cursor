name: Release Balanced Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.0.1-balanced.1"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: balanced-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked rendering dependencies
        shell: pwsh
        run: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile
          npx cbmp --version

      - name: Render source bitmaps
        shell: pwsh
        run: npx cbmp render.json

      - name: Build Balanced theme deterministically
        shell: pwsh
        run: |
          & .\tools\New-CompactWindowsTheme.ps1 -Profile Balanced
          $firstHash = (Get-FileHash `
            '.\themes\macOS-Balanced-Windows\Work.ani' `
            -Algorithm SHA256).Hash

          & .\tools\New-CompactWindowsTheme.ps1 -Profile Balanced
          $secondHash = (Get-FileHash `
            '.\themes\macOS-Balanced-Windows\Work.ani' `
            -Algorithm SHA256).Hash

          if ($firstHash -ne $secondHash) {
            throw "Work.ani is not deterministic: $firstHash != $secondHash"
          }
          Write-Output "Deterministic Work.ani SHA-256: $secondHash"

      - name: Validate Windows cursor package
        shell: pwsh
        run: |
          & .\tools\Test-BalancedWindowsTheme.ps1

      - name: Package release files
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9A-Za-z][0-9A-Za-z._-]*$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }

          $assetStem = "apple-cursor-balanced-windows-$env:RELEASE_TAG"
          $distDirectory = Join-Path $PWD 'dist'
          $stagingDirectory = Join-Path $distDirectory $assetStem
          New-Item -ItemType Directory -Path $stagingDirectory -Force | Out-Null

          Copy-Item `
            '.\themes\macOS-Balanced-Windows\*' `
            $stagingDirectory `
            -Recurse
          Copy-Item '.\README.md' $stagingDirectory
          Copy-Item '.\LICENSE' $stagingDirectory

          @(
            "Release: $env:RELEASE_TAG"
            "Commit: $env:GITHUB_SHA"
            "Workflow: $env:GITHUB_WORKFLOW"
            "Build environment: windows-latest"
            "Profile: Balanced"
          ) | Set-Content `
            -LiteralPath (Join-Path $stagingDirectory 'BUILD-INFO.txt') `
            -Encoding UTF8

          $archivePath = Join-Path $distDirectory "$assetStem.zip"
          Compress-Archive `
            -Path $stagingDirectory `
            -DestinationPath $archivePath `
            -CompressionLevel Optimal

          $archiveHash = (Get-FileHash $archivePath -Algorithm SHA256).Hash
          $checksumPath = "$archivePath.sha256"
          "$archiveHash  $([IO.Path]::GetFileName($archivePath))" |
            Set-Content -LiteralPath $checksumPath -Encoding UTF8

          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          "archive=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum=$checksumPath" >> $env:GITHUB_OUTPUT
          Write-Output "Packaged $archivePath"
          Write-Output "Archive SHA-256: $archiveHash"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apple-cursor-balanced-windows-${{ steps.package.outputs.tag }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          $assets = @($env:ARCHIVE_PATH, $env:CHECKSUM_PATH)
          $title = "Apple Cursor Balanced Windows $env:RELEASE_TAG"

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload `
              $env:RELEASE_TAG `
              @assets `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update release assets.' }
          }
          else {
            $arguments = @(
              'release',
              'create',
              $env:RELEASE_TAG
            ) + $assets + @(
              '--repo',
              $env:GITHUB_REPOSITORY,
              '--target',
              $env:GITHUB_SHA,
              '--title',
              $title,
              '--generate-notes'
            )
            if ($env:PRERELEASE -eq 'true') {
              $arguments += '--prerelease'
            }
            & gh @arguments
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create GitHub Release.' }
          }
